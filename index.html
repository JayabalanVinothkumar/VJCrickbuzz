<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crease">
<meta name="theme-color" content="#0b6e45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Crease – Live Cricket</title>
<style>
:root{
  --green:#0b6e45; --green2:#0e8a57; --bg:#eef0ef; --card:#fff; --text:#1d1f1e; --muted:#6b716e; --line:#e3e6e4;
  --live:#d9302c; --result:#1565c0; --upcoming:#b26a00; --chip:#f3f5f4; --four:#1e88e5; --six:#8e24aa; --wkt:#d32f2f;
  --top: env(safe-area-inset-top,0px); --bot: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1211; --card:#1a1e1c; --text:#e9ecea; --muted:#9aa29e; --line:#2a302d; --chip:#232826; --result:#64a8f0; --upcoming:#e0a040; }
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
header.top{position:fixed;inset:0 0 auto 0;z-index:20;background:var(--green);color:#fff;padding:calc(var(--top) + 8px) 12px 0}
.bar{display:flex;align-items:center;gap:10px;height:40px}
.bar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{font-weight:500;opacity:.8;font-size:12px;margin-left:6px}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:18px}
.iconbtn:active{background:rgba(255,255,255,.15)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 8px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;padding:10px 12px 9px;font-size:14px;font-weight:600;color:rgba(255,255,255,.75);border-bottom:3px solid transparent}
.subtabs button.on{color:#fff;border-bottom-color:#fff}
main{padding:calc(var(--top) + 56px) 0 calc(var(--bot) + 70px)}
body.hasSub main{padding-top:calc(var(--top) + 98px)}
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--bot)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;color:var(--muted)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--green2)}
.sec{padding:14px 12px 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.sec a{font-size:13px;text-transform:none;letter-spacing:0;color:var(--green2);font-weight:600}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 12px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .mcard{flex:0 0 84%;max-width:340px;scroll-snap-align:start}
.mcard{display:block;background:var(--card);border-radius:12px;padding:11px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.list .mcard{margin:0 12px 10px}
.mcard .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.mcard .meta b{color:var(--text);font-weight:600}
.trow{display:flex;align-items:center;gap:9px;padding:3px 0}
.trow .nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .sc{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.trow .sc small{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
.trow.dim .nm,.trow.dim .sc{color:var(--muted);font-weight:500}
.logo{width:24px;height:24px;border-radius:50%;flex:none;object-fit:cover;background:var(--chip)}
.logo.txt{display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff}
.status{margin-top:7px;font-size:13px;font-weight:600}
.st-live{color:var(--live)} .st-recent{color:var(--result)} .st-upcoming{color:var(--upcoming)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;vertical-align:1px;margin-right:6px;color:#fff;background:var(--live)}
.badge.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:3px;background:#fff;margin-right:4px;vertical-align:1px;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.2}}
.seg{display:flex;margin:12px;background:var(--chip);border-radius:10px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.series{padding:10px 14px 6px;font-size:13px;font-weight:700;color:var(--text)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.banner{margin:10px 12px 0;padding:10px 12px;border-radius:10px;background:#fff4d6;color:#6d4c00;font-size:13px;display:flex;gap:8px;align-items:center}
@media (prefers-color-scheme: dark){.banner{background:#3a3016;color:#f3d58a}}
.banner button{margin-left:auto;font-weight:700;text-decoration:underline;flex:none}
.news{display:flex;gap:12px;background:var(--card);margin:0 12px 10px;border-radius:12px;padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.news img{width:92px;height:70px;border-radius:8px;object-fit:cover;flex:none;background:var(--chip)}
.news h3{margin:0 0 4px;font-size:15px;line-height:1.3}
.news p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news time{font-size:11px;color:var(--muted);display:block;margin-top:4px}
/* match detail */
.mhead{background:var(--card);padding:12px 14px 12px;border-bottom:1px solid var(--line)}
.mhead .ttl{font-size:12px;color:var(--muted);margin-bottom:8px}
.mhead .trow{padding:4px 0}
.mhead .trow .nm{font-size:16px}
.mhead .trow .sc{font-size:18px}
.mhead .logo{width:30px;height:30px}
.mhead .status{font-size:14px}
.rr{font-size:12px;color:var(--muted);margin-top:4px}
.box{background:var(--card);margin:10px 0;padding:0}
.box h4{margin:0;padding:10px 14px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:8px 6px;background:var(--chip)}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:14px}
table.t td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
table.t td:last-child,table.t th:last-child{padding-right:14px}
table.t td.n{font-weight:600;color:var(--green2)}
@media (prefers-color-scheme: dark){table.t td.n{color:#5fd39a}}
table.t td.n .d{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
table.t td b{font-weight:700}
.kv{display:flex;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);width:38%;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 0;scrollbar-width:none}
.chips button{flex:none;padding:7px 12px;border-radius:16px;background:var(--card);font-size:13px;font-weight:600;border:1px solid var(--line)}
.chips button.on{background:var(--green);color:#fff;border-color:var(--green)}
.line{padding:9px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .mut{color:var(--muted)}
.balls{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
.ball{flex:none;min-width:28px;height:28px;padding:0 6px;border-radius:14px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--chip)}
.ball.b4{background:var(--four);color:#fff}.ball.b6{background:var(--six);color:#fff}.ball.bw{background:var(--wkt);color:#fff}
.ball.sep{background:none;min-width:8px;color:var(--muted)}
.com{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.com .ov{width:42px;flex:none;text-align:center}
.com .ov div:first-child{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.com .ov .ball{margin:5px auto 0}
.com .tx{flex:1;font-size:14px}
.com .tx b{font-weight:700}
.com .tx .dis{margin-top:5px;font-weight:600;color:var(--wkt)}
.overend{background:var(--chip);padding:7px 14px;font-size:12px;color:var(--muted);font-weight:600}
.btn{display:block;width:calc(100% - 24px);margin:12px;padding:12px;border-radius:10px;background:var(--green);color:#fff;font-weight:700;text-align:center}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.form{background:var(--card);margin:10px 0}
.form label{display:block;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.form input,.form select{display:block;width:100%;margin-top:5px;font:inherit;font-size:16px;color:var(--text);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.form .sw{display:flex;align-items:center;justify-content:space-between;color:var(--text);font-size:15px}
.form .sw input{width:auto;margin:0;transform:scale(1.3)}
.note{padding:4px 14px 12px;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--bot) + 80px);transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:.95}
.skel{height:110px;margin:0 12px 10px;border-radius:12px;background:linear-gradient(90deg,var(--card),var(--chip),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.upd{font-size:11px;color:var(--muted);text-align:center;padding:6px}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <button class="iconbtn" id="backBtn" hidden aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title">Crease</h1>
    <button class="iconbtn" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  </div>
  <div class="subtabs" id="subtabs" hidden></div>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button data-tab="matches"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7.5 5.5c2.5 3.5 2.5 9.5 0 13M16.5 5.5c-2.5 3.5-2.5 9.5 0 13"/></svg>Matches</button>
  <button data-tab="news"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>News</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>More</button>
</nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
const VERSION = "1.1.0";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("crease." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("crease." + k, JSON.stringify(v)); } catch {} },
};
let cfg = Object.assign({ relay: "https://crease-relay.vinoth-jey.workers.dev", key: "", refresh: 20, demo: false }, store.get("cfg", {}));
if (!cfg.relay) cfg.relay = "https://crease-relay.vinoth-jey.workers.dev";
const saveCfg = () => store.set("cfg", cfg);
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------------- data access ---------------- */
async function relayFetch(path, params = {}) {
  if (!cfg.relay) throw new Error("NO_RELAY");
  const u = new URL(cfg.relay.replace(/\/+$/, "") + path);
  for (const [k, v] of Object.entries(params)) if (v != null) u.searchParams.set(k, v);
  const r = await fetch(u, { headers: cfg.key ? { "x-relay-key": cfg.key } : {}, cache: "no-store" });
  if (!r.ok) { let m = "HTTP " + r.status; try { m = (await r.json()).error || m; } catch {} throw new Error(m); }
  return r;
}
async function api(path, params) { const j = await (await relayFetch("/api/" + path, { lang: "en", ...params })).json(); return j.data ?? j; }
async function rss(which) { const t = await (await relayFetch("/rss/" + which)).text(); return new DOMParser().parseFromString(t, "text/xml"); }

// walk any JSON shape and collect arrays that match a test
function collect(root, test, max = 6000) {
  const out = [], seen = new Set(), stack = [root]; let n = 0;
  while (stack.length && n++ < max) {
    const v = stack.pop();
    if (!v || typeof v !== "object" || seen.has(v)) continue;
    seen.add(v);
    if (Array.isArray(v)) { if (v.length && test(v)) out.push(v); for (const x of v) if (x && typeof x === "object") stack.push(x); }
    else for (const k in v) { const x = v[k]; if (x && typeof x === "object") stack.push(x); }
  }
  return out;
}
const firstArr = (root, test) => collect(root, test)[0] || null;
function findObj(root, test, max = 6000) {
  const seen = new Set(), stack = [root]; let n = 0;
  while (stack.length && n++ < max) {
    const v = stack.shift();
    if (!v || typeof v !== "object" || seen.has(v)) continue;
    seen.add(v);
    if (!Array.isArray(v) && test(v)) return v;
    for (const k in v) { const x = v[k]; if (x && typeof x === "object") stack.push(x); }
  }
  return null;
}

const IMG = "https://img1.hscicdn.com/image/upload/f_auto,t_ds_square_w_80";
const imgUrl = p => !p ? "" : /^https?:/.test(p) ? p : IMG + (p.startsWith("/") ? "" : "/") + p;

function bucket(m) {
  const s = String(m.state || m.stage || "").toUpperCase();
  if (["LIVE", "RUNNING", "INPROGRESS", "IN_PROGRESS", "STUMPS", "BREAK"].includes(s)) return "live";
  if (["PRE", "SCHEDULED", "UPCOMING", "FIXTURE", "NOT_STARTED"].includes(s)) return "upcoming";
  if (!s && m.startTime && new Date(m.startTime) > Date.now()) return "upcoming";
  return "recent";
}
function normTeam(t, m) {
  const tm = t.team || t;
  return {
    id: tm.id ?? tm.objectId,
    name: tm.longName || tm.name || tm.abbreviation || "TBA",
    short: tm.abbreviation || (tm.name || "").slice(0, 3).toUpperCase(),
    logo: imgUrl(tm.imageUrl || tm.image?.url),
    score: t.score || "",
    info: t.scoreInfo || "",
    live: !!t.isLive,
    winner: m && m.winnerTeamId != null && (tm.id === m.winnerTeamId || tm.objectId === m.winnerTeamId),
  };
}
function normMatch(m) {
  return {
    id: m.objectId ?? m.id,
    seriesId: m.series?.objectId ?? m.seriesId ?? m.series?.id,
    series: m.series?.longName || m.series?.name || "",
    title: m.title || "",
    format: m.format || m.internationalClassId || "",
    state: bucket(m),
    status: m.statusText || m.status || "",
    start: m.startTime || m.startDate || "",
    ground: m.ground?.smallName || m.ground?.name || m.ground?.longName || "",
    town: m.ground?.town?.name || "",
    teams: (m.teams || []).map(t => normTeam(t, m)),
    link: m.series && m.slug ? `https://www.espncricinfo.com/series/${m.series.slug}-${m.series.objectId}/${m.slug}-${m.objectId}/live-cricket-score` : "",
    raw: m,
  };
}
const isMatchArr = a => a[0] && typeof a[0] === "object" && Array.isArray(a[0].teams) && ("objectId" in a[0] || "id" in a[0]) && (a[0].series || a[0].statusText != null);

let lastSource = "";
/* ESPN's public sports API carries ESPNcricinfo's data (same match IDs) and allows
   direct calls from the phone, so no relay is needed for scores. */
const ESPN = "https://site.web.api.espn.com/apis";
async function getJSON(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
const stateOf = s => s === "in" ? "live" : s === "pre" ? "upcoming" : "recent";
function splitScore(x) { x = String(x || "").trim(); const m = x.match(/^(.*?)\s*\(([^)]*)\)\s*$/); return m ? { score: m[1].trim(), info: m[2] } : { score: x, info: "" }; }
function espnTeam(c, batId) {
  c = c || {}; const t = c.team || c; const id = String(t.id ?? c.id ?? "");
  const sc = splitScore(c.score);
  return { id, name: t.displayName || c.displayName || t.name || "TBA", short: t.abbreviation || c.abbreviation || "", logo: t.logos?.[0]?.href || c.logo || "",
    score: sc.score, info: sc.info, live: batId != null && String(batId) === id, winner: !!c.winner, national: !!(c.isNational ?? t.isNational) };
}
function espnStatus(type, summary, state) {
  const d = type?.description || "";
  if (state === "live") return [d && !/^(live|in progress)$/i.test(d) ? d : "", summary].filter(Boolean).join(" • ");
  if (state === "upcoming") return summary && !/^scheduled$/i.test(summary) ? summary : "";
  return summary || d;
}
function espnMatch(e, L) {
  const fs = e.fullStatus || {}; const state = stateOf(fs.type?.state || e.status);
  const teams = (e.competitors || []).map(c => espnTeam(c, state === "live" ? fs.battingTeamId : null));
  return { id: String(e.id), seriesId: String(L?.id ?? ""), series: L?.name || "", title: e.title || "", format: e.class?.eventType || e.class?.generalClassCard || "",
    state, status: espnStatus(fs.type, fs.longSummary || fs.summary || e.summary, state), start: e.date, ground: e.location || "", town: "", teams,
    intl: teams.length > 0 && teams.every(t => t.national), link: `https://www.espncricinfo.com/ci/engine/match/${e.id}.html` };
}
async function getMatches() {
  if (cfg.demo) { lastSource = "demo"; return DEMO.matches.map(normMatch); }
  try {
    const h = await getJSON(ESPN + "/v2/scoreboard/header?sport=cricket&lang=en&region=gb");
    const list = [];
    for (const L of h.sports?.[0]?.leagues || []) for (const e of L.events || []) list.push(espnMatch(e, L));
    if (!list.length) throw new Error("No matches right now");
    store.set("cache.matches", list);
    lastSource = "live";
    return list;
  } catch (e) {
    try { if (cfg.relay) { const l = await rssMatches(); if (l.length) { lastSource = "rss"; return l; } } } catch {}
    const c = store.get("cache.matches", null);
    if (c && c.length) { lastSource = "cache"; return c; }
    lastSource = "error:" + e.message;
    return DEMO.matches.map(normMatch);
  }
}
async function rssMatches() {
  const x = await rss("live");
  return [...x.querySelectorAll("item")].map(it => {
    const title = it.querySelector("title")?.textContent || "";
    const link = it.querySelector("link")?.textContent || it.querySelector("guid")?.textContent || "";
    const id = (link.match(/(\d{5,})/) || [])[1];
    const [a, b] = title.split(/\s+v\s+/);
    const team = s => { const mm = (s || "").trim().match(/^(.*?)\s*([\d\/&\s]+\*?)?$/); return { name: (mm?.[1] || s || "").trim(), short: (mm?.[1] || s || "").trim().slice(0, 3).toUpperCase(), score: (mm?.[2] || "").trim(), info: "", logo: "", live: /\*/.test(s || "") }; };
    const teams = [team(a), team(b)];
    return { id, seriesId: null, series: "", title: "", format: "", state: teams.some(t => t.live) ? "live" : "recent", status: it.querySelector("description")?.textContent || "", teams, link };
  }).filter(m => m.id);
}

async function getMatchDetail(seriesId, matchId) {
  if (cfg.demo || String(matchId).startsWith("demo")) return DEMO.detail[matchId] || DEMO.detail.demo1;
  return espnDetail(seriesId, matchId);
}
function statMap(st) { const m = {}; for (const c of st?.categories || []) for (const x of c.stats || []) m[x.name] = x.displayValue ?? x.value; return m; }
const DIS = { c: "caught", b: "bowled", lbw: "lbw", st: "stumped", ro: "run out", hw: "hit wicket", rtd: "retired", "c&b": "caught & bowled", obs: "obstructing the field" };
const oversFromBalls = b => b == null ? "" : `${Math.floor(b / 6)}${b % 6 ? "." + (b % 6) : ""}`;
const stripHtml = h => h ? new DOMParser().parseFromString(String(h).replace(/<br\s*\/?>/gi, "\n"), "text/html").body.textContent.trim() : "";
async function espnDetail(seriesId, matchId) {
  const base = `${ESPN}/site/v2/sports/cricket/${seriesId}`;
  const sum = await getJSON(`${base}/summary?event=${matchId}`);
  const comp = sum.header?.competitions?.[0] || {};
  const st = comp.status || {}; const state = stateOf(st.type?.state);
  const comps = comp.competitors || [];
  const match = { id: String(matchId), seriesId: String(seriesId), series: sum.header?.league?.name || "", title: comp.description || "", format: comp.class?.generalClassCard || comp.class?.eventType || "",
    state, status: espnStatus(st.type, st.summary, state), start: comp.date, ground: sum.gameInfo?.venue?.fullName || "", town: "",
    teams: comps.map(c => espnTeam(c, state === "live" ? st.battingTeamId : null)), link: `https://www.espncricinfo.com/ci/engine/match/${matchId}.html` };

  // ball-by-ball: the newest two pages (25 balls each)
  let items = [];
  if (state !== "upcoming") {
    const pageOf = p => getJSON(`${base}/playbyplay?event=${matchId}&page=${p}`).then(r => r.commentary || {}).catch(() => null);
    let last = Math.ceil((+comp.commentaryCount || 0) / 25);
    if (!last) { const first = await pageOf(1); last = first?.pageCount || 0; if (last <= 1 && first) items = first.items || []; }
    if (last >= 1 && !items.length) { const pages = await Promise.all([last, last - 1].filter(n => n >= 1).map(pageOf)); for (const pg of pages) if (pg) items.push(...(pg.items || [])); }
    items.sort((a, b) => (b.sequence || 0) - (a.sequence || 0));
  }
  const comments = items.map(c => {
    const pt = String(c.playType?.description || "").toLowerCase();
    return { id: c.id, inn: c.period, ov: c.over?.overs != null ? Number(c.over.overs).toFixed(1) : "", over: c.over?.number,
      title: c.shortText || "", text: stripHtml(c.text), post: stripHtml(c.postText), pre: stripHtml(c.preText),
      runs: c.scoreValue ?? 0, four: pt === "four", six: pt === "six", wkt: !!c.dismissal?.dismissal,
      wd: pt.includes("wide") ? 1 : 0, nb: pt.includes("no ball") ? 1 : 0, lb: pt === "leg bye" ? 1 : 0, by: pt === "bye" ? 1 : 0,
      dis: c.dismissal?.dismissal ? String(c.dismissal.text || "").replace(/\s+/g, " ").trim() : "", batId: c.dismissal?.batsman?.athlete?.id, raw: c };
  });

  // innings, built from each player's per-innings figures
  const innings = [];
  for (const c of comps) for (const l of c.linescores || []) {
    if (!l.isBatting) continue;
    const x = statMap(l.statistics);
    innings.push({ no: l.period, teamId: String(c.team?.id ?? c.id), team: espnTeam(c, null), runs: l.runs, wkts: l.wickets, overs: l.overs, target: l.target || null, cur: !!l.isCurrent, desc: l.description || "",
      extras: x.extras, b: +x.byes || 0, lb: +x.legbyes || 0, w: +x.wides || 0, nb: +x.noballs || 0, p: +x.penalties || 0, bat: [], bowl: [], fow: [], parts: [] });
  }
  innings.sort((a, b) => a.no - b.no);
  const rosters = sum.rosters || [];
  for (const inn of innings) {
    const bt = rosters.find(r => String(r.team?.id) === inn.teamId), bw = rosters.find(r => String(r.team?.id) !== inn.teamId);
    const per = p => { const l = (p.linescores || []).find(q => q.period === inn.no); return l ? statMap(l.linescores?.[0]?.statistics || l.statistics) : {}; };
    const nm = p => p.athlete?.displayName || p.athlete?.battingName || "";
    for (const p of bt?.roster || []) {
      const x = per(p);
      if (+x.batted) inn.bat.push({ pos: +x.battingPosition || 99, id: p.athlete?.id, name: nm(p), played: true, r: x.runs, b: x.ballsFaced, f: x.fours || 0, s: x.sixes || 0, sr: x.strikeRate,
        out: +x.outs > 0, dis: +x.outs > 0 ? (DIS[x.dismissalCard] || "out") : (x.retiredDescription || "not out") });
      else if (p.starter !== false) inn.bat.push({ pos: 200, name: nm(p), played: false });
    }
    inn.bat.sort((a, b) => a.pos - b.pos);
    for (const p of bw?.roster || []) {
      const x = per(p);
      if (+x.bowled || +x.balls) inn.bowl.push({ pos: +x.bowlingPosition || 99, name: nm(p), o: x.overs, m: x.maidens || 0, r: x.conceded, w: x.wickets || 0, eco: x.economyRate });
    }
    inn.bowl.sort((a, b) => a.pos - b.pos);
  }
  for (const mc of sum.matchcards || []) {
    const inn = innings.find(i => String(i.no) === String(mc.inningsNumber)); if (!inn) continue;
    if (mc.headline === "Batting") for (const d of mc.playerDetails || []) { const b = inn.bat.find(q => q.id === d.playerID); if (b && b.out && d.dismissal) b.dis = d.dismissal; }
    if (mc.headline === "Partnerships") inn.parts = (mc.playerDetails || []).map(q => ({ wk: q.partnershipWicketName, runs: q.partnershipRuns, overs: q.partnershipOvers, a: q.player1Name, ar: q.player1Runs, b: q.player2Name, br: q.player2Runs }));
  }
  // full dismissal wording from the commentary, where we have it
  for (const c of comments) if (c.wkt && c.batId && c.dis) for (const inn of innings) { const b = inn.bat.find(q => q.id === c.batId && q.out); if (b) { const t = c.dis.replace(/\s+\d+\s*\(.*$/, "").trim(); b.dis = t.startsWith(b.name) ? t.slice(b.name.length).trim() : t; } }

  // who is at the crease right now
  let current = null;
  const lastBall = items[0];
  if (state === "live" && lastBall) {
    const bat = (o, star) => o?.athlete ? { name: o.athlete.displayName, r: o.totalRuns ?? o.runs, b: o.faced, f: o.fours, s: o.sixes, sr: o.faced ? (100 * (o.totalRuns ?? o.runs ?? 0) / o.faced) : null, cur: star ? 1 : 0, played: true } : null;
    const bowl = (o, star) => o?.athlete ? { name: o.athlete.displayName + (star ? " *" : ""), o: oversFromBalls(o.balls) || o.overs, m: o.maidens, r: o.conceded, w: o.wickets, eco: o.balls ? o.conceded / (o.balls / 6) : null } : null;
    current = { bat: [bat(lastBall.batsman, true), bat(lastBall.otherBatsman)].filter(Boolean), bowl: [bowl(lastBall.bowler, true), bowl(lastBall.otherBowler)].filter(Boolean), inn: lastBall.innings || {} };
  }

  const note = t => (sum.notes || comp.notes || []).filter(n => n.type === t).map(n => n.text).join("; ");
  const pom = (st.featuredAthletes || []).filter(f => /match/i.test(f.displayName || f.name || "")).map(f => f.athlete?.displayName).filter(Boolean).join(", ");
  const info = [["Match", match.title], ["Series", match.series], ["Format", match.format], ["Date", fmtStart(match.start)], ["Match days", note("matchdays")],
    ["Venue", match.ground], ["Toss", note("toss").replace(/\s+,/g, ",")], ["Hours of play", note("hoursofplay")], ["Player of the match", pom],
    ["Officials", (sum.gameInfo?.officials || []).map(o => o.displayName).filter(Boolean).join(", ")], ["Status", match.status]].filter(r => r[1]);
  return { espn: true, match, innings, comments, current, info };
}

let detail = null, detailTab = "", innSel = null;
function normInnings(sc) {
  const arr = firstArr(sc, a => a[0] && typeof a[0] === "object" && (Array.isArray(a[0].inningBatsmen) || Array.isArray(a[0].inningBowlers))) || [];
  return arr.map((inn, i) => ({
    no: inn.inningNumber || i + 1,
    team: inn.team ? normTeam({ team: inn.team }) : { name: "Innings " + (i + 1), short: "INN" + (i + 1) },
    runs: inn.runs, wkts: inn.wickets, overs: inn.overs, target: inn.target,
    extras: inn.extras, b: inn.byes, lb: inn.legbyes, w: inn.wides, nb: inn.noballs, p: inn.penalties,
    isDecl: inn.isDeclared,
    bat: (inn.inningBatsmen || []).map(b => ({
      name: b.player?.longName || b.player?.name || "", played: !/DNB|no/i.test(String(b.battedType ?? "yes")),
      r: b.runs, b: b.balls, f: b.fours, s: b.sixes, sr: b.strikerate,
      out: b.isOut, dis: b.dismissalText?.long || b.dismissalText?.short || (b.isOut === false ? "not out" : ""),

      name: b.player?.longName || b.player?.name || "", o: b.overs, m: b.maidens, r: b.conceded, w: b.wickets, eco: b.economy, cur: b.currentType,
    })),
    fow: (inn.inningWickets || inn.inningFallOfWickets || []).map(w => ({
      n: w.fowWicketNum ?? w.wicketNum, r: w.fowRuns ?? w.runs, o: w.fowOvers ?? w.overs,
      who: w.player?.longName || w.dismissalBatsman?.longName || w.batsman?.longName || "",
    })),

}
function normComments(cm) {

  return arr.map(c => {

      over: c.overNumber, title: c.title || "", text,

}

async function viewMatch(seriesId, matchId, quiet) {

    return;

  if (!detail.espn) {

}
function headBlock(m) {

  const inn = detail && detail.match === m && detail.innings?.length ? detail.innings[detail.innings.length - 1] : null;
  let rr = "";

    const [o, b] = String(inn.overs).split(".").map(Number); const balls = o * 6 + (b || 0);
    if (balls) rr = `CRR ${(inn.runs / (balls / 6)).toFixed(2)}`;

/* ---------------- router ---------------- */
function setSubtabs(tabs, on, cb) {
  const el = $("#subtabs");
  if (tabs === null) { el.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.t === on)); return; }
  if (!tabs.length) { el.hidden = true; document.body.classList.remove("hasSub"); el._cb = null; el.innerHTML = ""; return; }
  el.hidden = false; document.body.classList.add("hasSub");
  el.innerHTML = tabs.map(([k, l]) => `<button data-t="${k}" class="${k === on ? "on" : ""}">${l}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { setSubtabs(null, b.dataset.t); cb(b.dataset.t); });
}
function parseHash() {
  const p = (location.hash.slice(1) || "home").split("/");
  if (p[0] === "match") return { name: "match", seriesId: p[1], matchId: p[2], sub: p[3] };
  return { name: ["home", "matches", "news", "more"].includes(p[0]) ? p[0] : "home" };
}
async function render(quiet = false) {
  if (busy) return; busy = true;
  $("#refreshBtn").classList.add("spin");
  try {
    if (route.name === "home") await viewHome(quiet);
    else if (route.name === "matches") await viewMatches(quiet);
    else if (route.name === "news") await viewNews(quiet);
    else if (route.name === "more") viewMore();
    else if (route.name === "match") await viewMatch(route.seriesId, route.matchId, quiet);
  } catch (e) { if (!quiet) V.innerHTML = `<div class="empty">Something went wrong: ${esc(e.message)}</div>`; }
  finally { busy = false; $("#refreshBtn").classList.remove("spin"); }
}
function onRoute() {
  route = parseHash();
  const tab = route.name === "match" ? null : route.name;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("#backBtn").hidden = route.name !== "match";
  $("#refreshBtn").hidden = route.name === "more";
  if (route.name !== "match") { setSubtabs([]); detailTab = ""; $("#title").innerHTML = { home: "Crease <small>Live Cricket</small>", matches: "Matches", news: "News", more: "More" }[route.name]; }
  window.scrollTo(0, 0);
  render(false);
  schedule();
}
function schedule() {
  clearInterval(timer);
  if (!cfg.refresh) return;
  timer = setInterval(() => {
    if (document.hidden || route.name === "more" || route.name === "news") return;
    if (route.name === "match" && detail?.match?.state !== "live") return;
    render(true);
  }, Math.max(10, cfg.refresh) * 1000);
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { location.hash = "#" + b.dataset.tab; });
$("#backBtn").onclick = () => { if (history.length > 1) history.back(); else location.hash = "#home"; };
$("#refreshBtn").onclick = () => render(true).then(() => toast("Updated"));
window.addEventListener("hashchange", onRoute);
document.addEventListener("visibilitychange", () => { if (!document.hidden && route.name !== "more") render(true); });

  ];
  return { matches, detail: { demo1: { sc, cm: { comments } }, demo2: { sc: { match: matches[1], content: { innings: [] } }, cm: null }, demo3: { sc: { match: matches[2], content: { innings: [] } }, cm: null } } };
